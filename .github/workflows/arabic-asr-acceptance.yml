name: Nass one-sample Arabic ASR acceptance
on:
  push:
    branches: [feat/nass-v0501-validation]
    paths:
      - 'scripts/get_arabic_fixture.py'
      - '.github/workflows/arabic-asr-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arabic-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NASS_MEDIA_DIR: ${{ github.workspace }}/nass-arabic-fixtures
      NASS_DATA_DIR: ${{ github.workspace }}/nass-arabic-work
      NASS_WHISPER_MODEL: base
      NASS_DEVICE: cpu
      NASS_COMPUTE_TYPE: int8
      NASS_BEAM_SIZE: '3'
      NASS_ARABIC_SAMPLES: '10'
      NASS_ALLOW_EXTERNAL_ASR: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and real local multilingual ASR
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e '.[asr]'
      - name: Download rights-cleared, checksum-verified FLEURS Arabic test audio
        run: python scripts/get_arabic_fixture.py
      - name: Evaluate real audio recognition against published Arabic reference
        run: |
          python scripts/arabic_asr_benchmark.py \
            --manifest nass-arabic-eval.jsonl \
            --output nass-arabic-asr-report.json \
            --max-samples 10 --policy arabic_basic
      - name: Save metrics and provenance; do not redistribute the audio sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nass-one-sample-arabic-asr
          path: nass-arabic-asr-report.json
          if-no-files-found: warn
