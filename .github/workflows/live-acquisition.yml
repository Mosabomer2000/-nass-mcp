name: Nass controlled public-video acquisition probe
on:
  # Avoid wasting public CI minutes or repeatedly testing access on every code push.
  push:
    branches:
      - feat/nass-v0501-validation
    paths:
      - 'scripts/acquisition_probe_v05.py'
      - '.github/workflows/live-acquisition.yml'
  workflow_dispatch:
    inputs:
      audio_client:
        description: 'YouTube player client'
        required: true
        type: choice
        options: [default, mweb, web_embedded, ios]
        default: mweb
      pot_provider:
        description: 'Start optional local BgUtils PO Token Provider (no credentials)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      NASS_PROBE_AUDIO_CLIENT: ${{ github.event_name == 'workflow_dispatch' && inputs.audio_client || 'mweb' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install source acquisition dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e '.[captions,audio]'
      - name: Start optional local BgUtils PO Token Provider
        if: github.event_name != 'workflow_dispatch' || inputs.pot_provider == true
        run: |
          python -m pip install 'bgutil-ytdlp-pot-provider==2.0.2'
          docker run --name nass-pot --rm -d --init -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2-node
          sleep 5
          docker ps --filter name=nass-pot --format '{{.Status}}'
      - name: Probe one short public video (no user credentials)
        run: timeout 210s python scripts/acquisition_probe_v05.py
      - name: Upload redacted source-access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nass-source-acquisition-evidence
          path: nass-live-acquisition.json
          if-no-files-found: warn
