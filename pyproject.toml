[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nass-mcp"
version = "0.3.2"
description = "Free multi-backend YouTube transcription MCP with true audio ASR fallback"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nass MCP Project"}]
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
captions = ["youtube-transcript-api>=1.2,<2", "yt-dlp[default]>=2025.11.12"]
audio = ["yt-dlp[default]>=2025.11.12", "pytubefix>=10,<13"]
asr = ["faster-whisper>=1.1,<3"]
remote = ["uvicorn>=0.30,<1"]
groq = ["requests>=2.31,<3"]
all = ["youtube-transcript-api>=1.2,<2", "yt-dlp[default]>=2025.11.12", "pytubefix>=10,<13", "faster-whisper>=1.1,<3", "requests>=2.31,<3"]
test = ["pytest>=8"]

[project.scripts]
nass-mcp = "nass_mcp.server:main"
nass-doctor = "nass_mcp.core:doctor_cli"
nass-backend = "nass_mcp.remote:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
nass_mcp = ["_node/*.mjs", "_node/package.json"]
